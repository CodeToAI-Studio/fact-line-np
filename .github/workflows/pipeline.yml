name: Fact Line NP Pipeline

# Runs the news pipeline (ingest → generate → publish → retention) and the
# Telegram approval bot on a schedule so the operation runs 24/7 even when
# the local PC is off. Both call `--once` (one pass then exit) — the same
# code that used to run as long-lived loops on the PC.
#
# - pipeline job:  the pipeline, every 15 min.
# - bot job:       SENDS new pending posts to Telegram every 5 min. It does
#                  NOT process taps — Approve/Reject taps are handled in real
#                  time by the FastAPI Telegram webhook on Railway
#                  (POST /webhooks/telegram). The bot job must never call
#                  getUpdates: Telegram returns 409 CONFLICT while a webhook
#                  is registered.
#
# NOTE: these must be the ONLY publishers/approval channels. Keep the local
# `watch_pipeline.py` AND `telegram_bot.py` STOPPED (the Startup batch no
# longer starts them) — otherwise you double-publish / double-send. Only the
# local uvicorn (dev preview) stays on the PC. Removing this file returns to
# local-only.

on:
  # Automatic runs are paused while the production Railway services are stopped.
  workflow_dispatch: {}   # manual "Run workflow" button

# Never let the same job overlap itself (a slow run waits for the next tick).
concurrency:
  group: fact-line-np-${{ github.workflow_ref }}-${{ github.job }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (one-shot cycle)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          UNCLUSTERED_RETENTION_DAYS: ${{ secrets.UNCLUSTERED_RETENTION_DAYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python watch_pipeline.py --once

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Run Telegram bot (send-only: send new pending posts for approval)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python telegram_bot.py --once
