<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Fact Line NP</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--fl-navy) 0%, var(--fl-navy-2) 100%); }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.3); width: 100%; max-width: 420px; }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo img { width: 80px; height: 80px; margin-bottom: 12px; }
        .login-logo h1 { font-size: 1.4rem; font-weight: 700; color: var(--fl-navy); margin: 0; }
        .login-logo p { font-size: .85rem; color: var(--text-muted); margin: 4px 0 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 6px; font-size: .95rem; transition: .2s; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: var(--fl-red); }
        .btn-login { width: 100%; padding: 14px; background: var(--fl-red); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: .2s; }
        .btn-login:hover { background: var(--fl-red-dark); }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: .9rem; }
        .alert-error { background: #FEE; color: #C00; border: 1px solid #FCC; }
        .alert-success { background: #EFE; color: #060; border: 1px solid #CFC; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-box">
            <div class="login-logo">
                <img src="/static/logo-circle.png" alt="Fact Line NP">
                <h1>Admin Login</h1>
                <p>Fact Line NP Content Management</p>
            </div>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success">{{ success }}</div>
            {% endif %}

            <form method="POST" action="/admin/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-login">Log In</button>
            </form>

            <p style="text-align:center; margin-top:24px; font-size:.8rem; color:var(--text-muted);">
                <a href="/web" style="color:var(--fl-red)">← Back to website</a>
            </p>
        </div>
    </div>
</body>
</html>
